<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body background="gvbfc.jpg"
>
  <h1>Formulario de contrato</h1>  

  <form action="a" method="get">
      <label for="nome"> Nome: </label>
      <input type="text" id="nome" name="nome" required>
      <br><br>
      
      

      <label for="e-mail"> E-mail:</label>
      <input type="text" id="email" name="Email" required ><br><br>


      
<label for="senha"> Senha: </label>
<input type="text" id="senha" name="Senha" required><br><br>

<label for="mensagem"> Mensagem: </label><br>
<textarea name="Mensagem" id="Mensagem"></textarea><br><br>


<p>Qual é o seu gênero? &#x1F308</p>
<input type="radio" id="feminino" name="gênero?" value="feminino">
<label for="feminino"> Feminino </label><br>

<input type="radio" id="masculino" name="gênero?" value="masculino">
<label for="masculino"> Masculino </label>


<p>Interesses</p>
<input type="checkbox" name="interesses" id="HTML" value="HTML" >
<label for="HTML"> HTML</label><BR></BR>


<input type="checkbox" name="interesses" id="CSS" value="CSS" >
<label for="CSS"> CSS</label><BR></BR>

<input type="checkbox" name="interesses" id=javascrit value="javascrit">
<label for="javascrit"> javascrit</label><br><br>


<label for="cidade"> Cidade:</label>
<select name="cidade" id="Cidade">

     <option value="sp"> São Paulo</option>
      <option value="rj"> Rio De Janeiro</option>
     <option value="mg"> Minas Gerais</option>
     <option value="rn"> Rio Granda Do Norte</option>
    <option value="pe">Pernanbuco</option>

</select><br><br>
<label for="cidade natal"> Cidade Natal:</label>
<input type="cidade natal" id="cidade natal" name="Cidade "><br><br>

<input type="submit" value="Enviar">
<input type="reset" value="Limpar" >


  </form>
  
</body>
</html>
